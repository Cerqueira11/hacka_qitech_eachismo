# O docker compose sobe a aplicacao e o banco juntos, com um comando so:
#
#     docker compose up
#
# Os testes rodam na sua maquina, contra a API que subiu aqui:
#
#     pip install -r requirements-dev.txt
#     pytest
#
# Nao precisa criar arquivo nenhum antes: cada configuracao abaixo tem um
# valor padrao, escrito no proprio ${VARIAVEL:-padrao}. Le-se assim:
# "use o que estiver na variavel VARIAVEL; se ela nao existir, use padrao".
#
# O .env continua valendo, e agora e OPCIONAL: se voce criar um (copiando
# o .env.example), o compose le esse arquivo e o que estiver la ganha do
# padrao. E o jeito de trocar uma porta ocupada ou o token, sem editar
# este arquivo.

services:
  api:
    build:
      context: .
      target: api
    ports:
      # Se a porta 3000 ja estiver ocupada na sua maquina, coloque
      # API_PORT=3001 (ou outra livre) no seu .env.
      - "${API_PORT:-3000}:3000"
    environment:
      # Dentro do compose, o banco atende pelo nome "db" — nao por localhost.
      # Por isso esta linha nao tem padrao pra sobrescrever: aqui dentro o
      # endereco do banco e sempre este.
      DATABASE_URL: postgresql+psycopg2://bootcamp:bootcamp@db:5432/bootcamp
      APP_ENV: ${APP_ENV:-local}
      SERVICE_NAME: ${SERVICE_NAME:-bootcamp-api}
      # A senha que protege os endpoints internos. O padrao vale pra
      # estudar; num sistema de verdade, isso nunca teria valor padrao.
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-default_token}
      # ISPB desta instituicao: identifica a conta de origem no grafo antifraude.
      INSTITUTION_ISPB: ${INSTITUTION_ISPB:-00000000}
      # Variavel que nao esta nesta lista NAO CHEGA no container: o compose
      # repassa o que esta escrito aqui, e mais nada.
      #
      # API externa de dispositivo cadastrado (R1), chamada so quando o device
      # nao esta em registered_device; o 200 e gravado na tabela. Localmente
      # quem responde e o mockserver abaixo: sem expectativa cadastrada ele
      # devolve 404, que a R1 le como "dispositivo nao cadastrado".
      DEVICE_API_URL: ${DEVICE_API_URL:-http://mockserver:1080}
      DEVICE_API_INTERNAL_TOKEN: ${DEVICE_API_INTERNAL_TOKEN:-default_token}
      DEVICE_API_TIMEOUT: ${DEVICE_API_TIMEOUT:-0.2}
      # DICT (R4): estatisticas de fraude por documento. Localmente quem
      # responde e o mesmo mockserver: sem expectativa ele devolve 404, que
      # a R4 le como "documento sem historico no DICT" (pessoa limpa).
      DICT_API_URL: ${DICT_API_URL:-http://mockserver:1080}
      DICT_API_INTERNAL_TOKEN: ${DICT_API_INTERNAL_TOKEN:-default_token}
      DICT_API_TIMEOUT: ${DICT_API_TIMEOUT:-0.5}
    volumes:
      # Monta o codigo pra dentro do container: salvou o arquivo,
      # a API recarrega sozinha (o --reload ali embaixo).
      - ./src:/app
    # --reload: salvou o arquivo, a API reinicia sozinha.
    command: uvicorn app:app --host 0.0.0.0 --port 3000 --no-server-header --reload
    healthcheck:
      # "Subiu" nao e a mesma coisa que "ja responde". E esta checagem
      # que diz quando a API passa a atender de verdade — espere ela
      # ficar (healthy) antes de rodar o pytest, ou o primeiro teste
      # bate numa porta que ainda nao responde.
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:3000/health_check\")'"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
      mockserver:
        condition: service_started

  # O agendador dos 8 jobs (decisao 4.2). Fica DESLIGADO no `docker compose up`
  # de sempre, de proposito: os testes de job contam o que cada execucao
  # processou, e um agendador rodando no mesmo banco disputaria esses itens.
  # Para ligar junto com a API:
  #
  #     docker compose --profile scheduler up
  scheduler:
    profiles: ["scheduler"]
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql+psycopg2://bootcamp:bootcamp@db:5432/bootcamp
      APP_ENV: ${APP_ENV:-local}
      SERVICE_NAME: bootcamp-scheduler
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-default_token}
      INSTITUTION_ISPB: ${INSTITUTION_ISPB:-00000000}
    volumes:
      - ./src:/app
    command: python scheduler.py
    depends_on:
      db:
        condition: service_healthy

  # Mock dos servicos de fora: API de dispositivo (R1) e DICT (R4). Os
  # testes cadastram as respostas em PUT /mockserver/expectation
  # (tests/utils/device_api_mock.py e tests/utils/dict_api_mock.py).
  # Sem expectativa: 404 -> dispositivo nao cadastrado / pessoa limpa.
  mockserver:
    image: mockserver/mockserver:5.15.0
    environment:
      # Em INFO (o padrao), cada requisicao sem expectativa (o 404 de todo
      # documento limpo no DICT) grava uma entrada de "didn't match" POR
      # expectativa cadastrada. Com centenas delas o log circular enche e
      # despeja as requisicoes recebidas que os testes conferem
      # (DeviceApiMock.calls, DictApiMock.calls), e o mockserver passa a
      # responder devagar o bastante para estourar o timeout da API.
      # Em WARN ele continua guardando as requisicoes e as expectativas.
      MOCKSERVER_LOG_LEVEL: WARN
    ports:
      - "${MOCK_PORT:-1080}:1080"

  db:
    build: ./database/.
    environment:
      POSTGRES_USER: bootcamp
      POSTGRES_PASSWORD: bootcamp
      POSTGRES_DB: bootcamp
    ports:
      # Mesma ideia: DB_PORT=5433 no .env se a 5432 estiver ocupada.
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      # A API so sobe depois que o banco responder de verdade.
      test: ["CMD-SHELL", "pg_isready -U bootcamp -d bootcamp"]
      interval: 3s
      timeout: 3s
      retries: 20

